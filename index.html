<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Природа</h1>
    </header>

    <section class="gallery" aria-label="Фотогалерея природы" aria-roledescription="карусель" tabindex="0">
      <div class="gallery__row">
        <button class="arrow arrow--prev" type="button" aria-label="Предыдущая страница" aria-controls="gallery-track" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
        </button>

        <div class="gallery__viewport" id="gallery-viewport">
          <div class="gallery__track" id="gallery-track"></div>
        </div>

        <button class="arrow arrow--next" type="button" aria-label="Следующая страница" aria-controls="gallery-track">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </button>
      </div>  
      <nav class="pager" aria-label="Страницы галереи"></nav>
      <!-- <p class="status" role="status" aria-live="polite" aria-atomic="true"></p> -->
    </section>
    <!-- <p class="hint">Используйте стрелки, точки или свайп на смартфоне</p>
    <noscript><p class="no-script">Для работы галереи включите JavaScript в браузере.</p></noscript> -->
  </main>
</body>
</html>
